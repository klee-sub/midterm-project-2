{% extends 'blog/base.html' %}
{% block content %}
{% for post in posts %}
<div class="post">
  <div class="date">{{ post.published_date }}</div>
  <h1><a href="{% url 'post_detail' pk=post.pk %}">{{ post.title }}</a></h1>
  <p>{{ post.text|truncatewords:30 }}</p>
  {% for tag in post.tags.all %}<span class="label label-info">#{{ tag.name }}</span> {% endfor %}
  <img src="{{ post.image.url }}" class="rounded blog-images-list" alt="{{ post.title }}">
</div>
{% empty %}<p>게시물이 없습니다.</p>{% endfor %}
{% endblock %}
